<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brand Management | Gurjeet Electronics ERP</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="wrapper">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-mobile-screen-button"></i>

            <span>Gurjeet ERP</span>

        </div>

        <ul class="menu">

            <li>
                <a href="/dashboard">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>
            </li>


            <li class="active">

                <a href="/brands">

                    <i class="fa-solid fa-tags"></i>

                    Brand Management

                </a>

            </li>


            <li>

                <a href="/products">

                    <i class="fa-solid fa-box"></i>

                    Product Master

                </a>

            </li>


           


            <li>

                <a href="/barcode">

                    <i class="fa-solid fa-barcode"></i>

                    Barcode Scanner

                </a>

            </li>


            <li>

                <a href="/stock">

                    <i class="fa-solid fa-warehouse"></i>

                    Stock Management

                </a>

            </li>


            <li>

                <a href="/sold-products">

                    <i class="fa-solid fa-check-circle"></i>

                    Sold Products

                </a>

            </li>

        </ul>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">


        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h4 class="mb-0">

                    Brand Management

                </h4>

                <small class="text-muted">

                    Manage Mobile Brands

                </small>

            </div>


            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#brandModal">

                <i class="fa-solid fa-plus me-1"></i>

                Add Brand

            </button>

        </div>



        <!-- ================= SEARCH ================= -->

        <div class="card shadow-sm border-0 mt-4">

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4">

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="fa-solid fa-search"></i>

                            </span>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Search Brand..."
                                id="searchBrand">

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= BRAND TABLE ================= -->

        <div class="card shadow-sm border-0 mt-4">

            <div class="card-header bg-white">

                <h5 class="mb-0">

                    Brand List

                </h5>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>#</th>

                                <th>Logo</th>

                                <th>Brand Name</th>

                                <th>Status</th>

                                <th width="170">

                                    Action

                                </th>

                            </tr>

                        </thead>


                        <tbody id="brandTableBody">

                            <tr>

                                <td
                                    colspan="5"
                                    class="text-center text-muted">

                                    Loading Brands...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

</div>



<!-- ===================================================== -->
<!-- ADD / EDIT BRAND MODAL -->
<!-- ===================================================== -->

<div
    class="modal fade"
    id="brandModal"
    tabindex="-1"
    aria-hidden="true">


    <div class="modal-dialog">

        <div class="modal-content">


            <!-- MODAL HEADER -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="brandModalTitle">

                    Add Brand

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>



            <!-- MODAL BODY -->

            <div class="modal-body">


                <form id="brandForm">

                    <!-- Hidden ID -->

                    <input
                        type="hidden"
                        id="brandId">



                    <!-- Brand Name -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Brand Name

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="brandName"
                            placeholder="Enter Brand Name"
                            required>

                    </div>



                    <!-- Logo -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Logo URL

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="brandLogo"
                            placeholder="Enter Logo URL">

                    </div>



                    <!-- Status -->

                    <div class="mb-3">

                        <label
                            class="form-label">

                            Status

                        </label>


                        <select
    class="form-select"
    id="brandStatus">

    <option value="active">
        Active
    </option>

    <option value="inactive">
        Inactive
    </option>

</select>

                    </div>


                </form>

            </div>



            <!-- MODAL FOOTER -->

            <div class="modal-footer">


                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-primary"
                    id="saveBrandBtn">

                    <i class="fa-solid fa-save me-1"></i>

                    Save Brand

                </button>

            </div>


        </div>

    </div>

</div>



<!-- ===================================================== -->
<!-- BOOTSTRAP JS -->
<!-- ===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ===================================================== -->
<!-- BRAND JAVASCRIPT -->
<!-- ===================================================== -->

<script>

    const API_URL = "/api/brands";

    const brandTableBody =
        document.getElementById("brandTableBody");

    const searchBrand =
        document.getElementById("searchBrand");

    const brandForm =
        document.getElementById("brandForm");

    const brandId =
        document.getElementById("brandId");

    const brandName =
        document.getElementById("brandName");

    const brandLogo =
        document.getElementById("brandLogo");

    const brandStatus =
        document.getElementById("brandStatus");

    const saveBrandBtn =
        document.getElementById("saveBrandBtn");

    const brandModalElement =
        document.getElementById("brandModal");

    const brandModal =
        new bootstrap.Modal(brandModalElement);

    const brandModalTitle =
        document.getElementById("brandModalTitle");


    let allBrands = [];



    // =====================================================
    // GET TOKEN
    // =====================================================

    function getToken() {

        return localStorage.getItem("token");

    }



    // =====================================================
    // LOAD BRANDS
    // =====================================================

    async function loadBrands() {

        try {

            const token = getToken();


            const response = await fetch(API_URL, {

                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " + token

                }

            });


            if (response.status === 401) {

                alert("Session expired. Please login again.");

                localStorage.removeItem("token");

                window.location.href = "/login";

                return;

            }


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message || "Failed to load brands"
                );

            }


            allBrands =
                data.brands || data.data || [];


            renderBrands(allBrands);


        }

        catch (error) {

            console.error(error);

            brandTableBody.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="text-center text-danger">

                        Unable to load brands.

                    </td>

                </tr>

            `;

        }

    }



    // =====================================================
    // RENDER BRANDS
    // =====================================================

    function renderBrands(brands) {


        if (!brands.length) {

            brandTableBody.innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="text-center text-muted">

                        No Brands Found

                    </td>

                </tr>

            `;

            return;

        }


        brandTableBody.innerHTML = "";


        brands.forEach((brand, index) => {


            const logo =
                brand.logo || "";


            const logoHTML = logo

                ? `

                    <img
                        src="${logo}"
                        alt="Logo"
                        width="40"
                        height="40"
                        style="
                            object-fit:contain;
                            border-radius:6px;
                        "
                        onerror="this.style.display='none'"
                    >

                `

                : `

                    <i
                        class="fa-solid fa-mobile-screen-button
                        text-muted fs-4">

                    </i>

                `;


            const status =
                String(brand.status || "active").toLowerCase();


            const statusBadge =
                status === "active"

                ? `<span class="badge bg-success">
                        Active
                   </span>`

                : `<span class="badge bg-secondary">
                        Inactive
                   </span>`;


            brandTableBody.innerHTML += `

                <tr>

                    <td>

                        ${index + 1}

                    </td>


                    <td>

                        ${logoHTML}

                    </td>


                    <td>

                        <strong>
                            ${brand.name}
                        </strong>

                    </td>


                    <td>

                        ${statusBadge}

                    </td>


                    <td>

                        <button
                            class="btn btn-sm btn-warning me-1"
                            onclick="editBrand('${brand._id}')">

                            <i class="fa-solid fa-pen"></i>

                        </button>


                        <button
                            class="btn btn-sm btn-danger"
                            onclick="deleteBrand('${brand._id}')">

                            <i class="fa-solid fa-trash"></i>

                        </button>

                    </td>

                </tr>

            `;

        });

    }



    // =====================================================
    // SAVE BRAND
    // =====================================================

    saveBrandBtn.addEventListener(
        "click",
        async function () {


            if (!brandForm.checkValidity()) {

                brandForm.reportValidity();

                return;

            }


            const name =
                brandName.value.trim();


            const logo =
                brandLogo.value.trim();


            const status =
                brandStatus.value;


            if (!name) {

                alert("Please enter brand name.");

                return;

            }


            const token =
                getToken();


            try {


                saveBrandBtn.disabled = true;


                saveBrandBtn.innerHTML = `

                    <span
                        class="spinner-border spinner-border-sm me-1">
                    </span>

                    Saving...

                `;


                const id =
                    brandId.value;


                const url =
                    id
                    ? `${API_URL}/${id}`
                    : API_URL;


                const method =
                    id
                    ? "PUT"
                    : "POST";


                const response =
                    await fetch(url, {

                        method: method,

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token

                        },

                        body: JSON.stringify({

                            name,
                            
                            status

                        })

                    });


                if (response.status === 401) {

                    alert(
                        "Session expired. Please login again."
                    );

                    localStorage.removeItem("token");

                    window.location.href = "/login";

                    return;

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to save brand"
                    );

                }


                alert(
                    id
                    ? "Brand Updated Successfully"
                    : "Brand Added Successfully"
                );


                brandForm.reset();

                brandId.value = "";

                brandModalTitle.textContent =
                    "Add Brand";


                brandModal.hide();


                loadBrands();


            }

            catch (error) {

                console.error(error);

                alert(error.message);

            }

            finally {

                saveBrandBtn.disabled = false;

                saveBrandBtn.innerHTML = `

                    <i class="fa-solid fa-save me-1"></i>

                    Save Brand

                `;

            }

        }
    );



    // =====================================================
    // EDIT BRAND
    // =====================================================

    window.editBrand =
        function(id) {


            const brand =
                allBrands.find(
                    item => item._id === id
                );


            if (!brand) {

                alert("Brand not found.");

                return;

            }


            brandId.value =
                brand._id;


            brandName.value =
                brand.name || "";


            brandLogo.value =
                brand.logo || "";


            brandStatus.value =
                String(brand.status || "active").toLowerCase();


            brandModalTitle.textContent =
                "Edit Brand";


            brandModal.show();

        };



    // =====================================================
    // DELETE BRAND
    // =====================================================

    window.deleteBrand =
        async function(id) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this brand?"
                );


            if (!confirmDelete) {

                return;

            }


            const token =
                getToken();


            try {


                const response =
                    await fetch(
                        `${API_URL}/${id}`,
                        {

                            method: "DELETE",

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }

                        }
                    );


                if (response.status === 401) {

                    alert(
                        "Session expired. Please login again."
                    );

                    localStorage.removeItem("token");

                    window.location.href = "/login";

                    return;

                }


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to delete brand"
                    );

                }


                alert("Brand Deleted Successfully");


                loadBrands();


            }

            catch (error) {

                console.error(error);

                alert(error.message);

            }

        };



    // =====================================================
    // SEARCH
    // =====================================================

    searchBrand.addEventListener(
        "input",
        function() {


            const search =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                allBrands.filter(
                    brand =>
                        brand.name
                            .toLowerCase()
                            .includes(search)
                );


            renderBrands(filtered);

        }
    );



    // =====================================================
    // MODAL RESET
    // =====================================================

    brandModalElement.addEventListener(
        "hidden.bs.modal",
        function() {

            brandForm.reset();

            brandId.value = "";

            brandModalTitle.textContent =
                "Add Brand";

        }
    );



    // =====================================================
    // PAGE LOAD
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            if (!getToken()) {

                alert(
                    "Please login first."
                );

                window.location.href =
                    "/login";

                return;

            }


            loadBrands();

        }
    );

</script>

</body>

</html>
